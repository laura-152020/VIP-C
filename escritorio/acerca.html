<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Acerca de VIP-C</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'">
<style>
:root{--bg:#f6f7f3;--ink:#1b2316;--sub:#5b6651;--line:#dfe3d8;--brand:#283517}
@media (prefers-color-scheme:dark){:root{--bg:#171c12;--ink:#e9ede4;--sub:#a3ad97;--line:#2c3424;--brand:#9fbf72}}
html,body{margin:0;height:100%;-webkit-user-select:none;user-select:none;cursor:default}
body{background:var(--bg);color:var(--ink);font:13px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
.cab{display:flex;gap:18px;align-items:center;padding:26px 28px 18px}
img{width:76px;height:76px}
h1{margin:0;font-size:22px;letter-spacing:.04em}
.sub{color:var(--sub);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
dl{margin:0 28px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:6px 18px}
dt{color:var(--sub)} dd{margin:0;word-break:break-all}
.pie{margin-top:auto;padding:14px 28px 18px;display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:11.5px}
</style></head>
<body>
<div class="cab"><img src="build/logo.png" alt=""><div><h1>VIP-C</h1><div class="sub">Visor interactivo de puntos críticos</div></div></div>
<dl>
<dt>Versión</dt><dd id="ver">—</dd>
<dt>Entidad</dt><dd>Gobernación de Antioquia · Secretaría de Infraestructura Física</dd>
<dt>Servidor</dt><dd id="url">—</dd>
<dt>Datos</dt><dd>Google Drive, Google Sheets y ArcGIS Online</dd>
</dl>
<div class="pie"><span>© 2026 Gobernación de Antioquia</span><span>Uso institucional</span></div>
</body></html>
